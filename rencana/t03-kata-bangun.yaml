
# Rencana eksperimen tim 3: Kata bangun 'Halo Meja'
# Label: Desain: ucapan yang diminta; negatif = rekaman program harian

tim: 3
judul: Kata bangun 'Halo Meja'
pembimbing: Ardika Satria
pilar: Suara
seed: 1003
ulangan: 4
durasi_kondisi_detik: 2.5
jeda_detik: 0.5

rekam:
  audio:
    aktif: true
    sample_rate: 16000
  kamera:
    aktif: false

faktor:
  partisipan:
    jenis: manual
    taraf:
      - P01
      - P02
      - P03
      - P04
      - P05
      - P06
      - P07
      - P08
