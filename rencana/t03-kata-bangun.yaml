  ucapan:
    jenis: isyarat
    taraf:
      - HALO MEJA
      - halo teman
      - meja makan
      - (diam)
    instruksi: "Ucapkan: {taraf}"

  kipas:
    - 0
    - 255

catatan: "Metrik utama: alarm palsu per jam pada data bersama"

metode:
  jenis_tugas: Deteksi biner
  masukan_model: Log-mel 64 pita, 1 s
  metrik_utama: Alarm palsu per jam + recall
  jalur:
    - CNN
    - TL
    - Transformer
    - AE
  pembanding_non_dl: MFCC rata-rata dan simpangan + Random Forest/SVM
  catatan_metode: Alarm palsu dihitung pada rekaman program harian
